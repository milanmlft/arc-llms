- name: Create setup directory
  ansible.builtin.file:
    path: /home/almalinux/litellm_setup
    state: directory
    owner: almalinux
    group: almalinux
    mode: "0755"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /home/almalinux/litellm_setup/docker-compose.yml
    owner: almalinux
    group: almalinux
    mode: "0644"
  notify: Reapply litellm compose project

- name: Render .env
  ansible.builtin.template:
    src: env.j2
    dest: /home/almalinux/litellm_setup/.env
    owner: almalinux
    group: almalinux
    mode: "0600"
  notify: Recreate litellm container

- name: Render LiteLLM config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /home/almalinux/litellm_setup/config.yaml
    owner: almalinux
    group: almalinux
    mode: "0644"
  notify: Recreate litellm container

- name: Start LiteLLM with Docker compose
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /home/almalinux/litellm_setup
  register: compose_up
  changed_when: >-
    'Started' in compose_up.stderr
    or 'Created' in compose_up.stderr
    or 'Recreated' in compose_up.stderr
